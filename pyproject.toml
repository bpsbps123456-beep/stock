[project]
name = "gbrc"
version = "0.1.0"
description = "Growth-Based Research Center local research workflow"
requires-python = ">=3.11"
dependencies = [
  "yfinance>=1.2,<2",
  "numpy>=2.0,<3",
  "exchange-calendars>=4.13.2,<5",
  "pandas>=2.2",
  "requests>=2.31",
  "pillow>=10",
  "pyarrow>=15",  # parquet: tests and desk caches read it (2026-11-21 리뷰: 기본 설치에서 테스트가 깨지지 않게)
]

[project.optional-dependencies]
dev = ["pytest>=9", "ruff", "pyarrow>=15"]  # `py -m unittest` alone runs the whole suite
# data/derived/analysis 연구 코드(클라우드 세션: pip install -e ".[research]").
# numba는 2026-09-23_strategy_research/code/etf_research 격자 엔진에서만 쓴다.
research = ["numba>=0.64,<0.65", "pyarrow>=15", "scipy>=1.11", "scikit-learn>=1.4", "joblib>=1.3", "matplotlib>=3.8,<4", "beautifulsoup4>=4.12"]

[tool.pytest.ini_options]
# data/derived/ 아래 내려받은 도구의 테스트까지 모으지 않도록 tests/만 본다.
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
