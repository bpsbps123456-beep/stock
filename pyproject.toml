[project]
name = "gbrc"
version = "0.1.0"
description = "Growth-Based Research Center local research workflow"
requires-python = ">=3.11"
dependencies = [
  "yfinance>=1.2,<2",
  "numpy>=2.0,<3",
  "numba>=0.64,<0.65",
]

[tool.unittest]
start-directory = "tests"

[tool.ruff]
line-length = 100
target-version = "py311"
